<div class="pl-account-error" role="alert"><NS:template error raw/></div>
<form class="pl-account-form" method="post" action="/">
  <div class="pl-account-field">
    <label for="new-user-name">Username:</label>
    <input type="text" id="new-user-name" name="user" size="16" maxlength="32" value="<NS:template user qhtml/>" autocomplete="username">
  </div>
  <div class="pl-account-field">
    <label for="new-user-email">Email:</label>
    <input type="text" id="new-user-email" name="email" size="16" maxlength="128" value="<NS:template email qhtml/>" autocomplete="email" inputmode="email">
  </div>
  <div class="pl-account-license">
    <input type="checkbox" id="new-user-license" name="license">
    <label for="new-user-license">Permission is granted to copy, distribute and/or modify any material
that I submit to this web site under the terms of the <a href="https://creativecommons.org/licenses/by-sa/4.0/"> Creative Commons Attribution-ShareAlike CC BY-SA 4.0 License </a>.</label>
  </div>
  <input type="hidden" name="op" value="newuser">
  <input type="hidden" name="verify" value="1">
  <input type="submit" value="create account">
</form>
