<table width="100%" cellspacing="2">
 <tr>
 <td bgcolor="#eeeeee" align="center">
  <table><tr><td>
  <center><font size="+1">Manage This Object's Filebox</font></center>
   <br />  
   <font size="+1" color="#ff0000"><NS:template ferror raw/></font>
   
   Urls to grab, if any (enter one on each line):
   
   <br />
   
   <textarea name="fb_urls" cols="75" rows="4"><NS:template fb_urls/></textarea>
   
   <br /><br />
   
   Attach files:
   
   <br />
   
   <input type="file" size="50" name="upload" id="filebox-upload" value="" multiple="multiple" />
   <input type="submit" name="filebox" VALUE="upload" />
   <div id="filebox-upload-list"></div>
   <script type="text/javascript">
   (function () {
     var input = document.getElementById('filebox-upload');
     var list = document.getElementById('filebox-upload-list');
     if (!input || !list || !input.files) {
       return;
     }

     input.onchange = function () {
       var files = input.files;
       var header;
       var items;
       var i;

       while (list.firstChild) {
         list.removeChild(list.firstChild);
       }

       if (!files || !files.length) {
         return;
       }

       header = document.createElement('div');
       header.appendChild(document.createTextNode(files.length + ' selected file' + (files.length == 1 ? '' : 's') + ':'));
       list.appendChild(header);

       items = document.createElement('ul');
       for (i = 0; i != files.length; i++) {
         var item = document.createElement('li');
         item.appendChild(document.createTextNode(files[i].name));
         items.appendChild(item);
       }
       list.appendChild(items);
     };
   }());
   </script>
   
   <br /><br />

   <i>Note: when uploading diagrams, please also upload their sources.</i>

   <br /><br />

   Delete files:
   
   <table>
    <tr>
    <td valign="top">
      <input type="submit" name="filebox" value="remove" />
	  <input type="hidden" name="tempdir" value="<NS:template tempdir qhtml/>" />
	  <input type="hidden" name="filelist" value="<NS:template filelist full/>" />
	  <input type="hidden" name="filechanges" value="<NS:template filechanges qhtml/>" />
    </td>
    <td>
      <NS:template rmlist raw/>
    </td>
    </tr>
   </table>
   
  </td></tr></table>
  
 </td>
 
</tr></table>
