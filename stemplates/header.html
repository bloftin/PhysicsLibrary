<style>
	.pl-header-quick-links { font: .8rem Arial, Helvetica, sans-serif; line-height: 1.5; }
	.pl-header-quick-links a { color: #174e80; display: inline-block; padding: .15rem .1rem; }
	#cse-search-box .pl-header-search-controls { align-items: center; display: flex; gap: .3rem; justify-content: flex-end; }
	#cse-search-box input[type=text] { border: 1px solid #8797a5; box-sizing: border-box; font: .85rem Arial, Helvetica, sans-serif; min-width: 0; padding: .3rem .45rem; }
	#cse-search-box input[type=submit] { background: #003399; border: 1px solid #002266; border-radius: 2px; color: #fff; cursor: pointer; font: .85rem Arial, Helvetica, sans-serif; padding: .3rem .65rem; }
	#cse-search-box input[type=submit]:hover { background: #002266; }
	.pl-header-quick-links a:focus-visible, #cse-search-box input:focus-visible { outline: 2px solid #003399; outline-offset: 2px; }
	table.tblheader
	{
		margin: auto;
		border-collapse: collapse;
		background-image: url("https://<NS:template imagesiteaddr/>/images/northfield_banner.jpg");
		background-size: 100%; /*Makes the image cover the entire table */
		background-repeat: no-repeat; /* Prevents tiling */
	}
</style>

				  <input type="hidden" name="ie" value="UTF-8" />
				  <input type="text" name="q" id="pl-header-search-q" size="31" aria-label="Search Physics Library" value="<NS:template q qhtml/>" />
				  <input type="submit" name="sa" value="Search" />
				</div>
			</form>
			<script type="text/javascript" src="https://cse.google.com/cse.js?cx=d7c37e2bb0d444808"></script>
			<script type="text/javascript">
				(function() {
					function restoreHeaderSearchQuery() {
						var field = document.getElementById('pl-header-search-q');
						if (!field || field.value) {
							return;
						}
						var match = window.location.search.match(/[?&]q=([^&]*)/);
						if (match) {
							field.value = decodeURIComponent(match[1].replace(/\+/g, ' '));
						}
					}
					restoreHeaderSearchQuery();
					if (window.addEventListener) {
						window.addEventListener('load', restoreHeaderSearchQuery, false);
					}
					window.setTimeout(restoreHeaderSearchQuery, 500);
				})();
			</script>

</table>
