<div class="pl-account-error" role="alert"><NS:template error raw/></div>
<form class="pl-account-form" method="post" action="/">
  <p>To regain access to your account, you'll have to change your password. To begin this process, enter your user name below and submit the form. An e-mail message will be sent to the address you registered with, containing further instructions.</p>
  <div class="pl-account-field">
    <label for="reset-username">Your username:</label>
    <input type="text" id="reset-username" name="username" size="40" value="<NS:template username qhtml/>" autocomplete="username">
  </div>
  <input type="submit" name="submit" value="submit">
  <input type="hidden" name="op" value="pwchangereq">
</form>
