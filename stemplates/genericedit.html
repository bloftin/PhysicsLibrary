<form method="post" action="/" enctype="multipart/form-data" accept-charset="UTF-8">
 <font color="#ff0000" size="+1"><NS:template error raw/></font>

  <NS:template editor raw/>
  
  Classification (See <a target="physicslibrary.popup" href="/?op=pacsbrowse">PACS</a>):
  <br>
  <input type="text" name="class" value="<NS:template class qhtml/>" size="75">
  <br>
  <font size="-2">
  (examples: "01.65.+g", "00., 45.20.Jj, 04.25.Dm". "pacs:" can be omitted, assumed by default.)
  </font>

 <input TYPE="hidden" NAME="id" VALUE="<NS:template id qhtml/>">
 <input TYPE="hidden" NAME="op" VALUE="edit">
 <input TYPE="hidden" NAME="from" VALUE="<NS:template from qhtml/>">

 <br><br>
 
 <center>
 <input TYPE="submit" name="post" VALUE="save changes">
 </center>
  
 <br>
 
 <NS:template fmanager raw/>

</form>
