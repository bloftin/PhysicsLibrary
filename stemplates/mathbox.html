<!-- math box -->
<style>
	.pl-article-box { margin: 0; min-width: 0; width: 100%; }
	.pl-article-box-header { background: #003399; border-bottom: 1px solid #002266; box-sizing: border-box; color: #fff; font: bold 1rem/1.2 Arial, Helvetica, sans-serif; padding: .15rem .5rem; }
	.pl-article-heading { align-items: baseline; display: flex; flex-wrap: wrap; gap: .15rem .75rem; }
	.pl-article-title { flex: 1 1 20rem; font: inherit; margin: 0; min-width: 0; overflow-wrap: anywhere; }
	.pl-article-type { font-size: .75rem; font-weight: normal; margin-left: auto; }
	.pl-article-parent { display: inline-block; margin-right: .35rem; }
	.pl-article-box-header a { color: #fff; }
	.pl-article-box-header a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
	.pl-article-box > .pl-rendered-content { box-sizing: border-box; min-width: 0; overflow-x: auto; text-align: left; width: 100%; }
	.pl-rendered-content table.BORDER,
	.pl-rendered-content table.tabular {
		border-collapse: collapse;
	}

	.pl-rendered-content table.BORDER th,
	.pl-rendered-content table.BORDER td {
		border: 1px solid #333333;
		padding: 2px 4px;
	}

	.pl-rendered-content table.tabular td.td11,
	.pl-rendered-content table.tabular th.td11 {
		border-left: 1px solid #333333;
		border-right: 1px solid #333333;
		padding: 2px 4px;
	}

	.pl-rendered-content table.tabular tr.hline td {
		border-left: 1px solid #333333;
		border-right: 1px solid #333333;
		height: 0;
		line-height: 0;
		padding: 0;
	}

	.pl-rendered-content table.tabular tr.hline hr {
		border: 0;
		border-top: 1px solid #333333;
		height: 0;
		margin: 0;
	}

	.pl-rendered-content table.equation {
		border-collapse: separate;
		border-spacing: 0;
	}

	.pl-rendered-content table.equation td.eqno {
		padding-left: 1.25em;
		white-space: nowrap;
		vertical-align: middle;
	}
</style>
<section class="pl-article-box">
	<header class="pl-article-box-header"><NS:template title raw/><NS:template ratingsbar raw/></header>
	<div class="pl-rendered-content"><NS:template content raw/></div>
</section>
<!-- end math box -->
