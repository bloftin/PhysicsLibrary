<P>
This is an example of the time independent Schrodinger equation with a ramp potential, <SPAN CLASS="MATH"><IMG
 WIDTH="77" HEIGHT="32" ALIGN="MIDDLE" BORDER="0"
 SRC="img1.png"
 ALT="$ V(x) = kx$"></SPAN>.  Substituing this potential into the S.E. gives

<P>
<!-- MATH
 \begin{displaymath}
\frac{d^2\psi(x)}{dx^2}=\frac{2m}{\hbar^2}\left[ kx - E \right] \psi(x)
\end{displaymath}
 -->
