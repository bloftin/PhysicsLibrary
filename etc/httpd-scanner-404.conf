# Include inside each live virtual host, before redirects and application routing.
# An inline error body avoids an ErrorDocument subrequest back into Noosphere.
RewriteEngine On
ErrorDocument 404 "Not found."

# This site has no PHP endpoints. Query strings are deliberately not inspected here.
RewriteRule \.(?:php[0-9]*|phtml|phar)(?:[/.;~]|$) - [R=404,L,NC]

# Known non-site scanner targets; do not reject arbitrary unknown article URLs.
RewriteRule ^/?(?:root|home|srv|storage|vendor|config|wordpress|wp-admin|wp-content|wp-includes|phpmyadmin|pma)(?:/|$) - [R=404,L,NC]
RewriteRule ^/?(?:.*?/)?\.(?:env(?:[.~].*)?|git|aws|ssh|claude|codex|gemini|config|openclaw|nerve)(?:/|$) - [R=404,L,NC]
RewriteRule ^/?(?:wp-config\.php(?:[.~].*)?|phpinfo\.php|configuration\.php|config\.php(?:[.~].*)?|composer\.(?:json|lock)|(?:database|dump|site)\.sql|(?:site|public_html|html)\.zip|id_rsa(?:\.pub)?)(?:/|$) - [R=404,L,NC]

# Retain the existing traversal-query guard, now with the same small 404 response.
RewriteCond %{QUERY_STRING} (^|&)p=php(?:/|%2f|$) [NC]
RewriteRule ^ - [R=404,L]
